services:
  - type: web
    name: truthlayer-api
    env: python
    rootDirectory: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DEMO_MODE
        value: false
      - key: ALLOWED_ORIGINS
        value: https://truthlayer.vercel.app
